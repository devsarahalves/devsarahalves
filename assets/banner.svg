<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Sarah Alves</title>
  <desc id="d">Aprendendo Python e dados, um projeto por vez.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56d4b0"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56d4b0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="299" rx="16" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="16" fill="url(#glow)"/>

  <!-- rótulo -->
  <text x="60" y="82" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="3" fill="#56d4b0">EM FORMAÇÃO · TECNOLOGIA E DADOS</text>

  <!-- nome -->
  <text x="60" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#e6edf3">Sarah Alves</text>

  <!-- detalhe -->
  <rect x="62" y="192" width="120" height="4" rx="2" fill="url(#line)"/>

  <!-- frase -->
  <text x="60" y="244" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#8b949e">Aprendendo Python e dados, um projeto por vez.</text>

  <!-- divisor + trecho de código -->
  <line x1="580" y1="80" x2="580" y2="220" stroke="#30363d" stroke-width="1"/>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8b949e">
    <text x="610" y="118"><tspan fill="#a78bfa">while</tspan> <tspan fill="#56d4b0">True</tspan>:</text>
    <text x="646" y="154">aprender()</text>
    <text x="646" y="190">construir()</text>
  </g>
