<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="412" viewBox="0 0 640 412" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Minha jornada: Base, Prática, Direção</title>
  <desc id="d">Base concluída com CS50P e curso internacional de inglês na Europa; Prática atual com SecurePass e SQL, Excel e Power BI em estudo; Direção: objetivo profissional em Análise de Dados, em grandes empresas e no cenário internacional.</desc>

  <rect x="0.5" y="0.5" width="639" height="411" rx="16" fill="#0d1117" stroke="#30363d"/>

  <!-- linha do tempo -->
  <line x1="56" y1="92" x2="56" y2="188" stroke="#56d4b0" stroke-width="3" stroke-linecap="round"/>
  <line x1="56" y1="212" x2="56" y2="308" stroke="#30363d" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>

  <!-- 1. Base (concluída) -->
  <circle cx="56" cy="80" r="12" fill="#56d4b0"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="96" y="88" font-size="28" font-weight="700" fill="#e6edf3">Base</text>
    <text x="96" y="120" font-size="19" fill="#8b949e">CS50P (Harvard/edX) e fundamentos de Python</text>
    <text x="96" y="146" font-size="19" fill="#8b949e">Curso internacional de inglês na Europa</text>
  </g>
  <text x="596" y="88" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1" fill="#56d4b0">CONCLUÍDA</text>

  <!-- 2. Prática (agora) -->
  <circle cx="56" cy="200" r="12" fill="#0d1117" stroke="#56d4b0" stroke-width="3"/>
  <circle cx="56" cy="200" r="5" fill="#56d4b0"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="96" y="208" font-size="28" font-weight="700" fill="#e6edf3">Prática</text>
    <text x="96" y="240" font-size="19" fill="#8b949e">SecurePass: gerador de senhas em Python</text>
    <text x="96" y="266" font-size="19" fill="#8b949e">SQL, Excel e Power BI em estudo</text>
  </g>
  <text x="596" y="208" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1" fill="#a78bfa">AGORA</text>

  <!-- 3. Direção (objetivo) -->
  <circle cx="56" cy="320" r="12" fill="#0d1117" stroke="#6e7681" stroke-width="2.5" stroke-dasharray="4 4"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="96" y="328" font-size="28" font-weight="700" fill="#e6edf3">Direção</text>
    <text x="96" y="360" font-size="19" fill="#8b949e">Objetivo profissional: <tspan font-size="21" font-weight="700" fill="#56d4b0">Análise de Dados</tspan></text>
    <text x="96" y="386" font-size="19" fill="#8b949e">Atuar em grandes empresas e no cenário internacional</text>
  </g>
  <text x="596" y="328" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1" fill="#6e7681">OBJETIVO</text>
